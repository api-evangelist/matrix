apis:
- aid: matrix:client-server-api
  name: Matrix Client-Server API
  description: >-
    REST API used by Matrix clients to communicate with a homeserver, covering login, room creation and
    management, message sending, sync, device management, end-to-end encryption, and push notifications.
    Authentication uses Bearer access tokens issued by the homeserver, with OAuth 2.0 supported in newer
    versions.
  humanURL: https://spec.matrix.org/latest/client-server-api/
  baseURL: https://matrix.org/_matrix/client
  tags:
  - Client-Server
  - Messaging
  - Rooms
  - Sync
  - Encryption
